[pytest]
# pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# 单个测试超过 10 分钟视为卡死：pytest-timeout 打印所有线程栈后中止（Windows 无 signal，统一用 thread 方式）。
# 起因：PR #47 首跑 windows-latest 在 test_desktop_app 段无输出挂起，无栈可查。
timeout = 600
timeout_method = thread

# Coverage configuration
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */.venv/*
    */__pycache__/*
    */site-packages/*
    setup.py
    */migrations/*
    # Gradio 布局装配（仅 UI 组件与事件接线，靠浏览器手动/集成验证）
    */src/web/ui/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Markers for categorizing tests
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ocr: marks tests as OCR-related tests